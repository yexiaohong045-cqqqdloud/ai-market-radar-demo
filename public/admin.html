<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>题库Go 卖家后台</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f6f7fb;color:#202331}button,input,select{font:inherit}.hide{display:none!important}.top{background:#191b26;color:#fff;padding:16px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-size:22px;font-weight:900;flex:1}.muted{color:#7b8090}.wrap{max-width:1180px;margin:auto;padding:24px 16px 70px}.login{max-width:420px;margin:70px auto;background:#fff;border:1px solid #e2e4ec;border-radius:18px;padding:26px}.login input{width:100%;padding:12px;border:1px solid #dcdfea;border-radius:10px;margin:6px 0 14px}.primary{border:0;background:#6b4df7;color:white;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.secondary{border:1px solid #d9dce5;background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid #e1e4ec;border-radius:14px;padding:18px}.stat b{font-size:28px;display:block}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid #ddd;background:white;border-radius:9px;padding:9px 12px;cursor:pointer}.panel{margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row select,.row input{padding:10px;border:1px solid #ddd;border-radius:9px}.card{border-bottom:1px solid #eee;padding:13px 0}.code{font-family:monospace;font-weight:800}.pill{padding:4px 8px;border-radius:999px;background:#eee;font-size:12px}.pill.unused{background:#eee9ff;color:#6848ef}.pill.used{background:#e8f7ef;color:#19754f}.pill.void{background:#feecef;color:#b53446}.member{display:grid;grid-template-columns:1fr 1.4fr .8fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.activity{display:grid;grid-template-columns:160px 1fr 170px;gap:10px;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}.err{color:#c83a4e}.ok{color:#17764c}.small{font-size:12px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.member,.activity{grid-template-columns:1fr}.top{padding:14px 16px}}
</style></head><body>
<div class="top"><div class="brand">题库Go · 卖家后台</div><span id="who"></span><button id="logout" class="secondary hide" onclick="signout()">退出</button></div>
<div class="wrap">
<section id="loginBox" class="login"><h2>管理员登录</h2><p class="muted">仅卖家/管理员使用。买家请使用前台网址。</p><input id="email" type="email" placeholder="管理员邮箱"><input id="password" type="password" placeholder="管理员密码"><button class="primary" style="width:100%" onclick="login()">登录后台</button><div id="loginMsg" class="err"></div></section>
<section id="app" class="hide">
<div class="stats"><div class="stat"><span class="muted small">注册买家</span><b id="sUsers">-</b></div><div class="stat"><span class="muted small">有效会员</span><b id="sVip">-</b></div><div class="stat"><span class="muted small">题目</span><b id="sQ">-</b></div><div class="stat"><span class="muted small">未使用激活码</span><b id="sUnused">-</b></div><div class="stat"><span class="muted small">已使用激活码</span><b id="sUsed">-</b></div></div>
<div class="tabs"><button onclick="tab('codes')">激活码</button><button onclick="tab('members')">会员管理</button><button onclick="tab('activity')">使用记录</button></div>
<div id="p-codes" class="panel"><h3>生成 / 查看激活码</h3><div class="row"><select id="days"><option value="30">30天</option><option value="90">90天</option><option value="180">180天</option><option value="365">365天</option></select><input id="count" type="number" min="1" max="100" value="10" style="width:100px"><button class="primary" onclick="gen()">生成</button></div><p class="muted small">已使用的码会显示使用者邮箱和使用时间；未使用的码可以作废。</p><div id="codes"></div></div>
<div id="p-members" class="panel hide"><h3>会员管理</h3><div id="members"></div></div>
<div id="p-activity" class="panel hide"><h3>使用记录</h3><p class="muted small">记录激活、刷题、收藏、错题、后台续期/取消等关键动作。</p><div id="activity"></div></div>
</section></div>
<script>
let token=localStorage.tiku_admin_token||'';const $=id=>document.getElementById(id);
async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(o.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||'请求失败');return d}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});if(d.user.role!=='admin')throw Error('这个账号不是管理员');token=d.token;localStorage.tiku_admin_token=token;await boot()}catch(e){$('loginMsg').textContent=e.message}}
function signout(){token='';delete localStorage.tiku_admin_token;$('app').classList.add('hide');$('logout').classList.add('hide');$('loginBox').classList.remove('hide');$('who').textContent=''}
async function boot(){try{const me=await api('/auth/me');if(me.user.role!=='admin')throw Error();$('loginBox').classList.add('hide');$('app').classList.remove('hide');$('logout').classList.remove('hide');$('who').textContent=me.user.name+' · 管理员';await Promise.all([loadDash(),loadCodes(),loadMembers(),loadActivity()])}catch{signout()}}
function tab(n){['codes','members','activity'].forEach(x=>$('p-'+x).classList.toggle('hide',x!==n));if(n==='codes')loadCodes();if(n==='members')loadMembers();if(n==='activity')loadActivity()}
async function loadDash(){const d=await api('/admin/dashboard');$('sUsers').textContent=d.users;$('sVip').textContent=d.activeMembers;$('sQ').textContent=d.questions;$('sUnused').textContent=d.unusedCodes;$('sUsed').textContent=d.usedCodes}
async function gen(){const d=await api('/admin/codes/generate',{method:'POST',body:JSON.stringify({days:Number($('days').value),count:Number($('count').value),plan:'vip'})});alert('已生成 '+d.codes.length+' 个激活码');await Promise.all([loadCodes(),loadDash()])}
async function loadCodes(){const d=await api('/admin/codes');$('codes').innerHTML=d.codes.map(c=>'<div class="card"><div class="row"><span class="code">'+esc(c.code)+'</span><span class="pill '+esc(c.status)+'">'+esc(c.status)+'</span><b>'+esc(c.days)+'天</b><button class="secondary" onclick="copyCode(\''+c.code+'\')">复制</button>'+(c.status==='unused'?'<button class="secondary" onclick="voidCode(\''+c.code+'\')">作废</button>':'')+'</div><div class="muted small">使用者：'+esc(c.usedBy||'—')+'　使用时间：'+(c.usedAt?new Date(c.usedAt).toLocaleString():'—')+'</div></div>').join('')||'<p class="muted">还没有激活码</p>'}
function copyCode(c){navigator.clipboard.writeText(c);alert('已复制 '+c)}
async function voidCode(c){await api('/admin/codes/void',{method:'POST',body:JSON.stringify({code:c})});await Promise.all([loadCodes(),loadDash()])}
async function loadMembers(){const d=await api('/admin/users');$('members').innerHTML=d.users.filter(u=>u.role!=='admin').map(u=>'<div class="member"><b>'+esc(u.name)+'</b><span>'+esc(u.email)+'</span><span>'+esc(u.membership.plan)+'</span><span>'+(u.membership.expiresAt?new Date(u.membership.expiresAt).toLocaleString():'未开通')+'</span><span><button class="secondary" onclick="extendU(\''+u.email+'\',30)">+30天</button> <button class="secondary" onclick="extendU(\''+u.email+'\',90)">+90天</button> <button class="secondary" onclick="revokeU(\''+u.email+'\')">取消</button></span></div>').join('')||'<p class="muted">暂无买家</p>'}
async function extendU(email,days){await api('/admin/users/extend',{method:'POST',body:JSON.stringify({email,days,plan:'vip'})});await Promise.all([loadMembers(),loadDash(),loadActivity()])}
async function revokeU(email){if(confirm('确定取消 '+email+' 的会员？')){await api('/admin/users/revoke',{method:'POST',body:JSON.stringify({email})});await Promise.all([loadMembers(),loadDash(),loadActivity()])}}
const names={activate:'激活会员',quiz:'开始刷题',favorite_add:'加入收藏',favorite_remove:'取消收藏',wrong_add:'加入错题',admin_extend:'后台续期',admin_revoke:'取消会员'};
async function loadActivity(){const d=await api('/admin/activity');$('activity').innerHTML=d.events.map(e=>'<div class="activity"><b>'+esc(names[e.type]||e.type)+'</b><div>'+esc(e.name||'')+' <span class="muted">'+esc(e.email||'')+'</span><br><span class="small muted">'+esc(JSON.stringify(e.detail||{}))+'</span></div><span class="muted">'+new Date(e.createdAt).toLocaleString()+'</span></div>').join('')||'<p class="muted">暂无使用记录</p>'}
if(token)boot();
</script></body></html>
